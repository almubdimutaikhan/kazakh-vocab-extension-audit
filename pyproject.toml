[project]
name = "kz-audit"
version = "0.1.0"
description = "Tokenizer and evaluation audit of ISSAI's Kazakh vocabulary extension of Qwen3.5-4B-Base"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch==2.6.0",
    "transformers==5.20.2",
    "tokenizers==0.23.3",
    "datasets==5.1.0",
    "huggingface-hub==2.3.0",
    "accelerate==1.15.0",
    "pandas==3.1.0",
    "numpy==2.4.6",
    "matplotlib==3.11.2",
    "safetensors==0.8.0",
]

[tool.uv]
package = false
